<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#06b6d4" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4" />

  <!-- Inner border accent -->
  <rect x="8" y="8" width="176" height="176" rx="36" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Lightning Bolt + Dumbbell Emblem -->
  <g filter="url(#glow)">
    <!-- Dumbbell Bar -->
    <rect x="52" y="91" width="88" height="10" rx="5" fill="#38bdf8" opacity="0.85" />
    
    <!-- Dumbbell Left Weights -->
    <rect x="42" y="74" width="10" height="44" rx="4" fill="url(#primaryGrad)" />
    <rect x="34" y="80" width="8" height="32" rx="3" fill="#0284c7" />

    <!-- Dumbbell Right Weights -->
    <rect x="140" y="74" width="10" height="44" rx="4" fill="url(#primaryGrad)" />
    <rect x="150" y="80" width="8" height="32" rx="3" fill="#0284c7" />

    <!-- Lightning Bolt Center -->
    <path d="M 104 36 L 72 102 L 96 102 L 86 156 L 126 86 L 100 86 Z" fill="url(#primaryGrad)" stroke="#f8fafc" stroke-width="2.5" stroke-linejoin="round" />
  </g>
</svg>
