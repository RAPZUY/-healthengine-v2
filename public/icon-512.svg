<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow512" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#06b6d4" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad512)" stroke="#1e293b" stroke-width="8" />

  <!-- Inner border accent -->
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="#334155" stroke-width="3" stroke-opacity="0.5" />

  <!-- Lightning Bolt + Dumbbell Emblem -->
  <g filter="url(#glow512)">
    <!-- Dumbbell Bar -->
    <rect x="138" y="243" width="236" height="26" rx="13" fill="#38bdf8" opacity="0.85" />
    
    <!-- Dumbbell Left Weights -->
    <rect x="112" y="198" width="26" height="116" rx="10" fill="url(#primaryGrad512)" />
    <rect x="90" y="214" width="22" height="84" rx="8" fill="#0284c7" />

    <!-- Dumbbell Right Weights -->
    <rect x="374" y="198" width="26" height="116" rx="10" fill="url(#primaryGrad512)" />
    <rect x="400" y="214" width="22" height="84" rx="8" fill="#0284c7" />

    <!-- Lightning Bolt Center -->
    <path d="M 278 96 L 192 272 L 256 272 L 230 416 L 336 230 L 268 230 Z" fill="url(#primaryGrad512)" stroke="#f8fafc" stroke-width="6" stroke-linejoin="round" />
  </g>
</svg>
